<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>My Habit Tracker</title>
</head>
<body>
<header class="top">
  <div>
    <p class="eyebrow">MY PERSONAL SYSTEM</p>
    <h1>Habit Tracker</h1>
  </div>
  <button id="installBtn" class="ghost hidden">Install</button>
</header>

<main>
<section class="card hero">
  <div>
    <span id="todayLabel"></span>
    <h2 id="score">0%</h2>
    <p>Today's progress</p>
  </div>
  <div class="ring"><span id="ringText">0%</span></div>
</section>

<section class="stats">
  <div class="stat"><b id="streak">0</b><span>Best streak</span></div>
  <div class="stat"><b id="doneCount">0</b><span>Done today</span></div>
  <div class="stat"><b id="totalCount">5</b><span>Total habits</span></div>
</section>

<section class="card">
  <div class="sectionHead"><h3>Today</h3><button id="resetBtn" class="textBtn">Reset today</button></div>
  <div id="habitList"></div>
</section>

<section class="card">
  <div class="sectionHead"><h3>7-day overview</h3></div>
  <div id="week"></div>
</section>

<section class="card">
  <div class="sectionHead"><h3>Quick note</h3></div>
  <textarea id="note" placeholder="How did today go?"></textarea>
</section>

<section class="card">
  <div class="sectionHead"><h3>Manage habits</h3></div>
  <div id="manage"></div>
  <div class="addRow">
    <input id="newHabit" maxlength="30" placeholder="Add a habit">
    <button id="addBtn">Add</button>
  </div>
</section>
</main>

<footer>Data is saved on this device.</footer>
<script src="app.js"></script>
</body>
</html>
